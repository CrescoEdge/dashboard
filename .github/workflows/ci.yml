# The dashboard is a Python server plus one static page (the Java/Maven project and its
# workflow were removed in 5b7a269, so pushes after 2026-07-07 ran no CI at all).
# This checks every script compiles and that the server starts and answers its page and
# API with no fabric to poll (it must report the connection error, not crash).
name: Dashboard CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pycrescolib
        run: python -m pip install --upgrade pip && python -m pip install pycrescolib
      - name: Compile every script
        run: python -m py_compile *.py
      - name: Serve with no fabric
        run: |
          set -u
          python dashboard_server.py --host 127.0.0.1 --port 1 --serve-port 18900 --interval 2 > server.log 2>&1 &
          pid=$!
          up=""
          for i in $(seq 1 40); do
            if curl -fs -o /dev/null http://127.0.0.1:18900/; then up=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          status=0
          if [ -z "$up" ]; then echo "the server never answered"; status=1; else
            curl -fs http://127.0.0.1:18900/ | grep -q "</html>" || { echo "/ is not the page"; status=1; }
            curl -fs http://127.0.0.1:18900/api/health | python -c 'import json,sys; h=json.load(sys.stdin); assert h["ok"] is False and h["error"], h' || { echo "/api/health"; status=1; }
            curl -fs http://127.0.0.1:18900/api/snapshot | python -c 'import json,sys; s=json.load(sys.stdin); assert s["nodes"] == [] and "summary" in s, s' || { echo "/api/snapshot"; status=1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18900/nope); [ "$code" = 404 ] || { echo "unknown path answered $code"; status=1; }
          fi
          kill "$pid" 2>/dev/null || true
          cat server.log
          exit $status
